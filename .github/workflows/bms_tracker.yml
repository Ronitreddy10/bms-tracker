name: BMS Ticket Tracker - Cron Check

on:
  schedule:
    # Run every 5 minutes for near-realtime detection
    - cron: '*/5 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

# Do NOT use cancel-in-progress — each run is a quick single check
# that completes in ~30 seconds, no need to cancel previous runs
concurrency:
  group: bms-tracker-group
  cancel-in-progress: false

jobs:
  check-showtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Grant write permissions so the job can push state back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (with full history for push)
        uses: actions/checkout@v4
        with:
          # Fetch latest to avoid push conflicts
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Single BMS Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bms_tracker.py --once

      - name: Persist State to Git
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest to avoid push conflicts from concurrent runs
          git pull --rebase origin main || true
          
          if git diff --quiet bms_state.json 2>/dev/null; then
            echo "No state changes to commit"
          else
            git add bms_state.json
            git commit -m "Auto-update tracker state [skip ci]"
            git push origin main || echo "Push failed (likely concurrent update, will retry next run)"
          fi
